projects:
  # ===== Profesionales (Exitus Credit) =====
  - id: asignacion-cartera
    group: pro
    title: "Motor de asignación automática de cartera"
    stack: [Python, Pandas, Polars, DuckDB, SQL Server]
    tags: [Python, SQL, Automatización]
    summary: "Reparte las cuentas grupales vencidas entre Comercial, Call Center, Cobranza de Campo y Despachos Externos con reglas de riesgo."
    objective: "Automatizar la asignación de cartera vencida entre los equipos de cobranza según reglas de riesgo, sin depender de procesos manuales."
    method: "Motor en Python con reglas de riesgo y procesamiento con Pandas, Polars y DuckDB."
    process:
      - "Aplica las reglas de riesgo a la cartera y construye la asignación para Comercial, Call Center, Cobranza de Campo y Despachos Externos."
      - "Gestiona el retiro de asignaciones y valida qué cuentas pueden venderse: las que no tienen pagos ni promesas de pago."
      - "Guarda cada asignación con cargas masivas a SQL Server. Así nace el primer historial de asignaciones y las cuentas se sincronizan automáticamente con las apps móviles de los gestores."
    result: "La asignación quedó automatizada, cada cuenta tiene historial y trazabilidad completa, y los gestores en campo reciben sus cuentas directamente en su app."

  - id: csv-a-parquet
    group: pro
    title: "Optimización de datos: de CSV a Parquet"
    stack: [Python, Polars, MotherDuck, Parquet]
    tags: [Python, Automatización]
    summary: "Archivos 88% más ligeros y lecturas de minutos a segundos, sin servidor de base de datos."
    objective: "Reducir el tiempo de generación de reportes y el espacio en disco cuando los datos viven en OneDrive y no hay un almacenamiento tipo Snowflake, Redis o SQL."
    method: "Migración de archivos CSV a formato Parquet con Python y MotherDuck."
    process:
      - "Convertí los CSV históricos a Parquet y los organicé en subcarpetas por tipo de archivo."
      - "Los scripts de reportes pasaron a leer Parquet en lugar de CSV."
    result: "El almacenamiento bajó 88% y la lectura de archivos pasó de 2–3 minutos a 4–5 segundos, lo que acelera todos los reportes que dependen de esos datos."
    bars: {from_label: "CSV", from_value: "2.5 GB", to_label: "Parquet", to_value: "300 MB", to_pct: 12}

  - id: reportes-automaticos
    group: pro
    title: "Reportes automáticos con envío por correo"
    stack: [Python, Power Automate, Power BI, Excel]
    tags: [Python, Power BI, Automatización]
    summary: "Calculadoras de liquidación y reportes de pagos que se generan y se envían sin intervención."
    objective: "Eliminar el trabajo manual de preparar y enviar los reportes semanales y diarios de crédito grupal."
    method: "Scripts en Python que procesan los pagos y flujos de Power Automate que distribuyen los reportes."
    process:
      - "Un script procesa los pagos y los ordena según la asignación de cada actor de cobranza."
      - "Como no hay licencia para editar en Power BI Service, Power Automate actualiza el reporte al terminar el script y envía por correo la captura del tablero a los interesados."
      - "El reporte de Excel también sale con su captura de pantalla adjunta en el correo."
      - "Las calculadoras de liquidación semanales y los reportes diarios de pagos quedaron 100% automatizados."
    result: "Los reportes llegan solos a quien los necesita, sin captura manual."

  - id: tableros-cartera
    group: pro
    title: "Tableros de cartera y monitoreo de migración"
    stack: [Power BI, SQL, Python, xlwings]
    tags: [Power BI, SQL, Python]
    summary: "Cobertura de mora, salud de la colocación y desempeño de promotores en un solo lugar."
    objective: "Dar seguimiento a la cartera: cobertura de mora, salud de la colocación y desempeño de los promotores regionales."
    method: "Dashboards en Power BI, análisis estratégico mensual y monitoreo de migración casi en tiempo real."
    process:
      - "Modelado de dashboards en Power BI para el análisis mensual y el monitoreo de la migración de cartera."
      - "Scripts con xlwings conectan consultas de gran volumen con los archivos de Excel ejecutivos y operativos, y eliminan la captura manual y sus errores."
