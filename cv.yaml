summary:
  en: "Data Analyst with 2+ years of hands-on experience in Python (Pandas, Polars, DuckDB), SQL, Power BI, Excel, R, and Tableau. At a credit and collections company, builds data infrastructure, automated portfolio allocation, past-due portfolio sales, and end-to-end reporting pipelines used daily by field agents, call centers, and supervisors. Reduced report read times from minutes to seconds and fully automated recurring operational reports. Previously specialized in recruitment analytics (Power BI, SQL, ATS data) after 5+ years in IT recruitment. Fluent in English and Spanish."

about_es:
  - "Soy Elias Mina, analista de datos bilingüe. Hoy trabajo en una empresa de crédito y cobranza, donde construyo la infraestructura de datos y la automatización detrás de la operación: motores en Python para asignar cartera, reportes que se generan y se envían solos, y dashboards en Power BI que usan a diario los equipos de campo, call center y supervisión. Una de mis optimizaciones más grandes redujo 88% el tamaño de los datos y llevó los tiempos de lectura de minutos a segundos."
  - "Trabajo con Python (Pandas, Polars, DuckDB), SQL, Power BI, R y Tableau, y me certifiqué como Analista de Datos en TripleTen. Mi experiencia previa en reclutamiento de TI me dejó una ventaja: entiendo cómo hablan el negocio y la tecnología, y sé convertir datos en decisiones concretas."

