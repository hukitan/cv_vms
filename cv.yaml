  - id: portal-convenios
    group: pro
    title: "Portal de convenios de pago grupales"
    stack: [Python, PDF, QR]
    tags: [Python, Automatización]
    summary: "Convenios en PDF al momento, con saldo del día y un QR para validar su autenticidad."
    objective: "Generar convenios de pago grupales al momento, con el saldo y el monto de liquidación del día."
    method: "Portal web que consulta los datos por referencia y genera el documento en el momento."
    process:
      - "Con la referencia, el portal obtiene el saldo actual y el monto de liquidación al día de hoy."
      - "Genera el PDF del convenio al vuelo y permite descargarlo."
      - "El pie del documento lleva un código QR para validar su autenticidad y vigencia."
    result: "Cada convenio sale con datos del día y se puede verificar escaneando su QR."

  - id: ruleta-sorteos
    group: pro
    title: "Ruleta de sorteos para clientes"
    stack: [Python, Flask, MotherDuck, Railway, Power Automate]
    tags: [Python, Automatización]
    summary: "Ruleta en línea ligada a la referencia del cliente, con premios y probabilidades personalizadas."
    objective: "Crear una ruleta de sorteos en línea que reconozca a cada cliente por su referencia y lleve los resultados a los flujos de trabajo de la empresa."
    method: "App web en Flask desplegada en Railway, con datos en MotherDuck."
    process:
      - "El enlace trae la referencia del cliente: la app consulta MotherDuck, muestra su nombre (bloqueado) y avisa si la referencia no existe."
      - "Cada cliente tiene sus propios pesos de premios, así que las probabilidades del sorteo son personalizadas."
      - "Al girar, la app envía el resultado por correo (SMTP) y manda un webhook firmado con HMAC-SHA256 a Power Automate."
      - "Incluye una página de consulta por referencia."
    result: "Una ruleta lista para campañas, con premios a la medida de cada cliente, confirmación por correo y resultados integrados a Power Automate."

  - id: vems-pypi
    group: pro
    title: "vems: paquete de Python en PyPI"
    stack: [Python, PyPI]
    tags: [Python, Automatización]
    summary: "Mis utilidades de todos los días: lectura segura de CSV, logging de scripts y aviso al terminar."
    objective: "Dejar de copiar y pegar las mismas funciones entre proyectos: reunirlas en un paquete instalable y reutilizable."
    method: "Paquete de Python publicado en PyPI. Se instala con pip install vems."
    process:
      - "Lectura segura de archivos CSV, sin importar la codificación del archivo."
      - "Opción para leer todas las columnas como texto (str) y evitar que se adivinen los tipos de dato."
      - "Logging de scripts: guarda el registro en una carpeta del escritorio."
      - "Notificación y sonido para avisar cuando un script termina."
      - "Y otras utilidades pequeñas que uso a diario."
    result: "Utilidades reutilizables disponibles con un solo comando en cualquier proyecto."
    links:
      - {label: "Ver en PyPI", url: "https://pypi.org/project/vems/"}

