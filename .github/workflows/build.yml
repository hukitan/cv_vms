name: Build CV, site and release
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # crear/actualizar el release
  pages: write      # publicar en GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate CV (.tex) and site from cv.yaml
        run: python build.py

      - name: Read PDF name from cv.yaml
        run: |
          echo "PDF_NAME=$(python -c "import yaml; print(yaml.safe_load(open('cv.yaml', encoding='utf-8'))['meta']['pdf_name'])")" >> "$GITHUB_ENV"

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: build

      - name: Place PDF in site
        run: mv build/cv.pdf "dist/$PDF_NAME"

      - name: Get timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d %T')" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: CV Final
          body: "Última actualización: ${{ env.TIMESTAMP }} UTC"
          tag_name: CV
          files: dist/${{ env.PDF_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: dist/${{ env.PDF_NAME }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
